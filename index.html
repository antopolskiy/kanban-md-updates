<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="What's new in kanban-md. Versioned release reports with practical examples and real terminal screenshots.">
  <title>kanban-md / What's new</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0d11; --text: #e0e4ea; --muted: #a3abb8; --line: #2b3340; --blue: #6d9cff; --green: #6ecb8b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    header, main, footer { width: min(860px, calc(100% - 40px)); margin: auto; }
    header { padding: 32px 0; border-bottom: 1px solid var(--line); font: 600 15px/1.6 Menlo, Consolas, monospace; }
    header span { color: var(--green); }
    main { padding: 64px 0; }
    h1 { margin: 0 0 16px; font-size: clamp(36px, 7vw, 54px); letter-spacing: -.04em; line-height: 1.15; }
    p { margin: 0 0 32px; max-width: 64ch; color: var(--muted); }
    ol { margin: 40px 0 0; padding: 0; list-style: none; }
    li { padding: 28px 0; border-top: 1px solid var(--line); }
    a { color: var(--blue); text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 6px; }
    .release { display: inline-block; font-size: 24px; font-weight: 600; line-height: 1.35; }
    .meta { display: block; margin-top: 10px; color: var(--muted); font: 13px/1.6 Menlo, Consolas, monospace; }
    footer { padding: 24px 0 40px; border-top: 1px solid var(--line); font-size: 14px; }
    @media (max-width: 480px) { main { padding: 40px 0; } .release { font-size: 21px; } }
  </style>
</head>
<body>
  <header><span>$</span> kanban-md / what's new</header>
  <main>
    <h1>What's new in kanban-md.</h1>
    <p>Release reports with practical examples and real terminal screenshots. Pick a version to see its changes.</p>
    <ol>
      <li><a class="release" href="releases/v0.39.0/">v0.39.0 / Field Notes / Composable Workflow Views</a><span class="meta">2026-10-05 · <a href="https://github.com/antopolskiy/kanban-md/releases/tag/v0.39.0">Release notes and downloads</a></span></li>
    </ol>
  </main>
  <footer><a href="https://github.com/antopolskiy/kanban-md">Project</a> · <a href="https://github.com/antopolskiy/kanban-md/releases">Downloads and release notes</a></footer>
</body>
</html>
