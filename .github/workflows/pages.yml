name: Deploy reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out report files
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test staging checks
        run: node --test scripts/stage-report.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
